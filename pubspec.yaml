# @format

name: sib
description: "Sib - Accounting"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqlite3: ^3.5.2
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  flutter_localizations:
    sdk: flutter
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
